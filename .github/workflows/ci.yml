name: nvr-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "offline/bin/**"
      - "offline/manifest.json"
      - "offline/plugins/**"
      - "internal/webui/static/hls.min.js"
      - "internal/webui/static/HLS_LICENSE.txt"
      - "vendor/**"
      - "go.sum"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nvr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-core:
    runs-on: ubuntu-latest
    env:
      GOPROXY: "off"
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Plate OCR source
        uses: actions/checkout@v4
        with:
          repository: wfuzatto/Plate_ocr
          ref: 6be42f0a20664b99f72613286fa5d98be502113b
          path: _build/plate-ocr
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Vendor pinned HLS.js for offline playback
        run: |
          HLS_VERSION="1.7.3"
          HLS_ZIP_SHA256="abbda85f3e9b8325fc6b8dbf4fa612ea87144ebad93c2150594e64aad58ec529"
          rm -rf /tmp/nvr-hls /tmp/nvr-hls.zip
          curl --fail --location --silent --show-error             "https://github.com/video-dev/hls.js/releases/download/v${HLS_VERSION}/release.zip"             --output /tmp/nvr-hls.zip
          echo "${HLS_ZIP_SHA256}  /tmp/nvr-hls.zip" | sha256sum -c -
          mkdir -p /tmp/nvr-hls
          unzip -q /tmp/nvr-hls.zip -d /tmp/nvr-hls
          HLS_FILE="$(find /tmp/nvr-hls -type f -name 'hls.min.js' | head -n 1)"
          test -n "$HLS_FILE"
          cp "$HLS_FILE" internal/webui/static/hls.min.js

      - name: Vendor pinned Go modules
        env:
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "sum.golang.org"
          GOFLAGS: ""
        run: |
          go mod tidy
          go mod vendor
          test -f vendor/modules.txt
          grep -q "github.com/pion/webrtc/v4 v4.2.22" vendor/modules.txt

      - name: Validate embedded JavaScript
        run: |
          node --check internal/webui/static/app.js
          node --check internal/webui/static/hls.min.js

      - name: Test with dependency resolution disabled
        env:
          GOFLAGS: "-mod=vendor"
        run: go test ./...

      - name: Enforce offline runtime policy
        env:
          GOFLAGS: "-mod=vendor"
        run: sh scripts/verify-offline.sh

      - name: Test pinned Plate OCR fully offline
        working-directory: _build/plate-ocr
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
        run: go test ./...

      - name: Build offline Linux binaries
        env:
          CGO_ENABLED: "0"
          GOFLAGS: "-mod=vendor"
        run: |
          mkdir -p offline/bin/linux-amd64 offline/bin/linux-arm64

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o offline/bin/linux-amd64/nvr ./cmd/nvr
          (cd offline/bin/linux-amd64 && sha256sum nvr > nvr.sha256)

          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o offline/bin/linux-arm64/nvr ./cmd/nvr
          (cd offline/bin/linux-arm64 && sha256sum nvr > nvr.sha256)

          mkdir -p offline/plugins/plate-ocr/linux-amd64 offline/plugins/plate-ocr/linux-arm64
          (
            cd _build/plate-ocr
            GOPROXY=off GOSUMDB=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/offline/plugins/plate-ocr/linux-amd64/plate-ocr" ./cmd/plate-ocr
            GOPROXY=off GOSUMDB=off CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/offline/plugins/plate-ocr/linux-arm64/plate-ocr" ./cmd/plate-ocr
          )
          (cd offline/plugins/plate-ocr/linux-amd64 && sha256sum plate-ocr > plate-ocr.sha256)
          (cd offline/plugins/plate-ocr/linux-arm64 && sha256sum plate-ocr > plate-ocr.sha256)

      - name: Generate offline manifest
        run: |
          AMD64_SHA="$(cut -d' ' -f1 offline/bin/linux-amd64/nvr.sha256)"
          ARM64_SHA="$(cut -d' ' -f1 offline/bin/linux-arm64/nvr.sha256)"
          PLATE_AMD64_SHA="$(cut -d' ' -f1 offline/plugins/plate-ocr/linux-amd64/plate-ocr.sha256)"
          PLATE_ARM64_SHA="$(cut -d' ' -f1 offline/plugins/plate-ocr/linux-arm64/plate-ocr.sha256)"
          cat > offline/manifest.json <<EOF
          {
            "schema_version": 1,
            "source_commit": "$GITHUB_SHA",
            "go_version": "$(go version | awk '{print $3}')",
            "artifacts": [
              {
                "os": "linux",
                "arch": "amd64",
                "path": "offline/bin/linux-amd64/nvr",
                "sha256": "$AMD64_SHA"
              },
              {
                "os": "linux",
                "arch": "arm64",
                "path": "offline/bin/linux-arm64/nvr",
                "sha256": "$ARM64_SHA"
              },
              {
                "component": "plate-ocr",
                "source_commit": "6be42f0a20664b99f72613286fa5d98be502113b",
                "os": "linux",
                "arch": "amd64",
                "path": "offline/plugins/plate-ocr/linux-amd64/plate-ocr",
                "sha256": "$PLATE_AMD64_SHA"
              },
              {
                "component": "plate-ocr",
                "source_commit": "6be42f0a20664b99f72613286fa5d98be502113b",
                "os": "linux",
                "arch": "arm64",
                "path": "offline/plugins/plate-ocr/linux-arm64/plate-ocr",
                "sha256": "$PLATE_ARM64_SHA"
              }
            ]
          }
          EOF

      - name: Commit binaries into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum vendor offline/bin offline/plugins offline/manifest.json internal/webui/static/hls.min.js internal/webui/static/HLS_LICENSE.txt
          if git diff --cached --quiet; then
            echo "Offline binaries already match this source."
            exit 0
          fi
          git commit -m "build: refresh offline runtime artifacts [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: nvr-offline-core
          path: |
            offline/bin/
            offline/plugins/
            offline/manifest.json
            offline/install.sh
            offline/run-portable.sh
            deploy/nvr.service
            deploy/nvr-plate-ocr.service
            deploy/plate-ocr.json
            internal/webui/static/hls.min.js
            internal/webui/static/HLS_LICENSE.txt
          if-no-files-found: error
